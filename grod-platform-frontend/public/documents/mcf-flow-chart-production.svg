<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Flow chart production MCF</title>
  <desc id="desc">Schema visuel simplifie du processus de production Morocco Copper Foundry</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f5e9c"/>
    </marker>
    <marker id="arrow-copper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c76b35"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#236b48"/>
    </marker>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7faf5"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#f8c28c"/>
      <stop offset="0.48" stop-color="#c76b35"/>
      <stop offset="1" stop-color="#8f3f22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#183321" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f4f6f1; }
      .panel { fill: #ffffff; stroke: #ccd8cf; stroke-width: 2; }
      .zone { fill: url(#card); stroke: #d8e1d9; stroke-width: 2; }
      .title { font: 900 52px Arial, Helvetica, sans-serif; fill: #0d2538; letter-spacing: 0; }
      .subtitle { font: 800 22px Arial, Helvetica, sans-serif; fill: #52675a; letter-spacing: 0; }
      .section-title { font: 900 20px Arial, Helvetica, sans-serif; fill: #0d2538; letter-spacing: 0; }
      .label { font: 800 19px Arial, Helvetica, sans-serif; fill: #15241b; letter-spacing: 0; }
      .small { font: 700 15px Arial, Helvetica, sans-serif; fill: #5b6b60; letter-spacing: 0; }
      .tiny { font: 700 13px Arial, Helvetica, sans-serif; fill: #607065; letter-spacing: 0; }
      .badge { fill: #eaf5ea; stroke: #cfe4d2; stroke-width: 1; }
      .badge-text { font: 900 15px Arial, Helvetica, sans-serif; fill: #16623d; letter-spacing: 0; }
      .icon-card { fill: #ffffff; stroke: #d9e2dc; stroke-width: 2; filter: url(#shadow); }
      .blue-line { fill: none; stroke: #0f5e9c; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .copper-line { fill: none; stroke: #c76b35; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-copper); }
      .green-line { fill: none; stroke: #236b48; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .dark-line { fill: none; stroke: #17251c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <rect class="panel" x="34" y="30" width="1532" height="990" rx="30"/>

  <text class="title" x="800" y="86" text-anchor="middle">Flow chart production MCF</text>
  <text class="subtitle" x="800" y="124" text-anchor="middle">Morocco Copper Foundry - processus industriel cuivre simplifie</text>

  <rect class="zone" x="92" y="154" width="1416" height="250" rx="22"/>
  <text class="section-title" x="800" y="190" text-anchor="middle">ZONE RECEPTION ET TRI FERRAILLE</text>

  <g transform="translate(140 218)">
    <rect class="icon-card" width="170" height="120" rx="16"/>
    <rect x="38" y="58" width="92" height="26" rx="5" fill="#27343a"/>
    <rect x="56" y="35" width="54" height="28" rx="4" fill="#56646b"/>
    <circle cx="60" cy="94" r="10" fill="#0d2538"/>
    <circle cx="120" cy="94" r="10" fill="#0d2538"/>
    <text class="label" x="85" y="152" text-anchor="middle">Presse ferraille</text>
  </g>

  <g transform="translate(360 218)">
    <rect class="icon-card" width="170" height="120" rx="16"/>
    <rect x="38" y="72" width="74" height="28" rx="6" fill="#29373b"/>
    <path d="M74 70 L110 38 L142 54" fill="none" stroke="#d8832f" stroke-width="12" stroke-linecap="round"/>
    <path d="M142 54 L132 86" fill="none" stroke="#d8832f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="58" cy="105" r="9" fill="#0d2538"/>
    <circle cx="102" cy="105" r="9" fill="#0d2538"/>
    <text class="label" x="85" y="152" text-anchor="middle">Grue grappin</text>
  </g>

  <g transform="translate(580 218)">
    <rect class="icon-card" width="210" height="120" rx="16"/>
    <path d="M62 88 L92 42 L122 88 Z" fill="#e9f4ec" stroke="#244634" stroke-width="4"/>
    <circle cx="145" cy="52" r="15" fill="#d7773f"/>
    <rect x="134" y="68" width="34" height="28" rx="6" fill="#236b48"/>
    <circle cx="58" cy="45" r="10" fill="#0f5e9c"/>
    <circle cx="92" cy="31" r="10" fill="#0f5e9c"/>
    <text class="label" x="105" y="152" text-anchor="middle">Tri ferraille</text>
    <text class="small" x="105" y="176" text-anchor="middle">local / import</text>
  </g>

  <g transform="translate(850 218)">
    <rect class="icon-card" width="170" height="120" rx="16"/>
    <rect x="54" y="26" width="62" height="46" rx="5" fill="#2f3f47"/>
    <rect x="30" y="82" width="110" height="16" rx="5" fill="#d9a13f"/>
    <text class="label" x="85" y="152" text-anchor="middle">B.5t</text>
  </g>

  <g transform="translate(1060 218)">
    <rect class="icon-card" width="130" height="70" rx="12"/>
    <text class="label" x="65" y="44" text-anchor="middle">P.G</text>
    <rect class="icon-card" x="0" y="96" width="130" height="70" rx="12"/>
    <text class="label" x="65" y="140" text-anchor="middle">P.P.B</text>
  </g>

  <g transform="translate(1250 205)">
    <rect class="icon-card" width="175" height="175" rx="18"/>
    <rect x="55" y="30" width="64" height="72" rx="8" fill="#d94d39"/>
    <rect x="46" y="98" width="82" height="28" rx="5" fill="#29373b"/>
    <line x1="87" y1="132" x2="87" y2="160" stroke="#0f5e9c" stroke-width="7" marker-end="url(#arrow-blue)"/>
    <text class="label" x="87" y="154" text-anchor="middle" dy="-38">P.B</text>
  </g>

  <path class="blue-line" d="M1020 280 C1090 280 1108 290 1125 315"/>
  <path class="blue-line" d="M930 338 C920 420 780 390 780 470"/>

  <rect class="zone" x="350" y="430" width="850" height="450" rx="22"/>
  <text class="section-title" x="775" y="466" text-anchor="middle">ZONE PRODUCTION ET CONTROLE</text>

  <g transform="translate(415 505)">
    <rect class="icon-card" width="150" height="110" rx="16"/>
    <rect x="32" y="28" width="86" height="52" rx="8" fill="#2f6fa5"/>
    <path d="M34 82 H118" stroke="#11344c" stroke-width="8"/>
    <text class="label" x="75" y="145" text-anchor="middle">Stock M.P</text>
  </g>

  <g transform="translate(540 700)">
    <circle cx="65" cy="60" r="55" fill="#2c744c"/>
    <rect x="42" y="45" width="46" height="52" rx="8" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M50 44 L65 20 L80 44" fill="none" stroke="#fff" stroke-width="5"/>
    <text class="label" x="65" y="142" text-anchor="middle">E.T.R.F</text>
    <text class="small" x="65" y="166" text-anchor="middle">Gaz</text>
  </g>

  <g transform="translate(705 718)">
    <rect x="0" y="40" width="112" height="70" rx="12" fill="url(#copper)" stroke="#8e3b20" stroke-width="3"/>
    <path d="M18 40 C18 20 94 20 94 40" fill="none" stroke="#c76b35" stroke-width="8"/>
    <text class="label" x="56" y="142" text-anchor="middle">Anodes</text>
  </g>

  <g transform="translate(900 705)">
    <rect class="icon-card" width="170" height="120" rx="16"/>
    <rect x="34" y="34" width="102" height="58" rx="8" fill="#2d3c43"/>
    <rect x="52" y="48" width="42" height="30" rx="4" fill="#d98344"/>
    <circle cx="116" cy="62" r="10" fill="#4cbe67"/>
    <text class="label" x="85" y="152" text-anchor="middle">Up Cast</text>
  </g>

  <g transform="translate(910 520)">
    <rect class="icon-card" width="170" height="120" rx="16"/>
    <rect x="35" y="36" width="100" height="62" rx="8" fill="#45565d"/>
    <circle cx="64" cy="66" r="16" fill="#d8832f"/>
    <rect x="88" y="50" width="32" height="30" rx="4" fill="#e8f0e8"/>
    <text class="label" x="85" y="152" text-anchor="middle">Conform</text>
  </g>

  <g transform="translate(635 510)">
    <rect class="icon-card" width="150" height="110" rx="16"/>
    <rect x="38" y="30" width="74" height="18" rx="6" fill="#cfd8d1"/>
    <rect x="32" y="48" width="86" height="44" rx="8" fill="url(#copper)"/>
    <text class="label" x="75" y="145" text-anchor="middle">Stock P.F</text>
  </g>

  <g transform="translate(1240 515)">
    <rect class="icon-card" width="170" height="120" rx="16"/>
    <path d="M35 84 H136" stroke="#1a2b20" stroke-width="10" stroke-linecap="round"/>
    <path d="M52 72 L76 40 L105 84" fill="none" stroke="#236b48" stroke-width="8" stroke-linecap="round"/>
    <text class="label" x="85" y="152" text-anchor="middle">Export</text>
  </g>

  <path class="copper-line" d="M565 560 C610 560 625 620 612 700"/>
  <path class="copper-line" d="M660 762 H700"/>
  <path class="green-line" d="M815 760 C850 760 865 755 895 755"/>
  <path class="green-line" d="M985 705 C985 675 985 655 985 640"/>
  <path class="dark-line" d="M1068 760 C1135 760 1170 615 1238 585"/>
  <path class="dark-line" d="M785 565 C830 565 860 565 910 565"/>

  <g transform="translate(815 760)">
    <rect class="badge" x="0" y="-54" width="110" height="34" rx="17"/>
    <text class="badge-text" x="55" y="-32" text-anchor="middle">V &gt; 99.9%</text>
    <rect class="badge" x="0" y="-8" width="110" height="34" rx="17"/>
    <text class="badge-text" x="55" y="14" text-anchor="middle">O +/- 99%</text>
    <rect class="badge" x="0" y="38" width="110" height="34" rx="17"/>
    <text class="badge-text" x="55" y="60" text-anchor="middle">R &lt; 99%</text>
  </g>

  <g transform="translate(108 520)">
    <rect class="zone" width="210" height="270" rx="18"/>
    <text class="section-title" x="28" y="44">Legende</text>
    <text class="tiny" x="28" y="82">P.F : produit fini</text>
    <text class="tiny" x="28" y="112">B.5t : balance 5 tonnes</text>
    <text class="tiny" x="28" y="142">M.P.L : matiere premiere local</text>
    <text class="tiny" x="28" y="172">M.P.I : matiere premiere import</text>
    <text class="tiny" x="28" y="202">E.T.R.F : refining furnace</text>
    <text class="tiny" x="28" y="232">P.B : pont bascule</text>
  </g>

  <g transform="translate(90 910)">
    <rect class="zone" width="880" height="78" rx="18"/>
    <g transform="translate(35 22)">
      <circle cx="18" cy="18" r="18" fill="#10311f"/>
      <path d="M10 18 L16 24 L28 10" fill="none" stroke="#fff" stroke-width="4"/>
      <text class="label" x="52" y="16">Securite</text>
      <text class="tiny" x="52" y="38">Processus controle</text>
    </g>
    <g transform="translate(255 22)">
      <circle cx="18" cy="18" r="18" fill="#10311f"/>
      <path d="M18 8 V28 M8 18 H28" stroke="#fff" stroke-width="4"/>
      <text class="label" x="52" y="16">Tracabilite</text>
      <text class="tiny" x="52" y="38">Suivi de chaque etape</text>
    </g>
    <g transform="translate(505 22)">
      <circle cx="18" cy="18" r="18" fill="#10311f"/>
      <path d="M12 28 L18 8 L24 28 Z" fill="none" stroke="#fff" stroke-width="4"/>
      <text class="label" x="52" y="16">Qualite</text>
      <text class="tiny" x="52" y="38">Analyses et controles</text>
    </g>
    <g transform="translate(705 22)">
      <circle cx="18" cy="18" r="18" fill="#10311f"/>
      <path d="M8 26 L16 18 L22 22 L30 10" fill="none" stroke="#fff" stroke-width="4"/>
      <text class="label" x="52" y="16">Performance</text>
      <text class="tiny" x="52" y="38">Optimisation continue</text>
    </g>
  </g>

  <text x="1390" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="900" fill="#b86535">MCF</text>
  <text class="label" x="1390" y="972" text-anchor="middle">Morocco Copper Foundry</text>
  <text class="small" x="1390" y="996" text-anchor="middle">Excellence in Copper</text>
</svg>
