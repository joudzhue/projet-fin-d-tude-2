spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    placeholders:
      textLobType: CLOB
app:
  rate-limit:
    enabled: false
  upload-cleanup:
    enabled: false
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-characters
  bootstrap-admin:
    email: admin-test@grod.local
    password: TestPassword123!
    name: Admin Test
